<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學生 Scratch 作品集</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }
        #portfolio-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .student-card {
            background: #ffffff;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .student-name {
            color: #2980b9;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
            margin-top: 0;
        }
        .project-list {
            list-style-type: none;
            padding: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .project-list li {
            margin-top: 10px;
        }
        .project-list a {
            text-decoration: none;
            color: #fff;
            background-color: #3498db;
            padding: 10px 15px;
            border-radius: 5px;
            display: inline-block;
            transition: background-color 0.3s;
        }
        .project-list a:hover {
            background-color: #217dbb;
        }
    </style>
</head>
<body>

    <h1>學生 Scratch 作品集</h1>
    
    <!-- 這裡的內容會由 JS 動態生成 -->
    <div id="portfolio-container"></div>

    <!-- 引入資料檔 -->
    <script src="data.js"></script>
    <!-- 引入邏輯檔 -->
    <script src="app.js"></script>
</body>
</html>
